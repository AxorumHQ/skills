# A research agent and an ads agent spending from one team budget, each under
# a mandate of its own, with the research agent's model tokens metered.
#
# The interview, answer by answer, and where each answer went:
#   Agents        research_bot buys model access and data; ads_bot buys ads.
#                 Both act for the marketing lead.
#                 -> parties: two agents, roles [buyer], their capabilities.
#   Currencies    US dollars in cents, and model tokens counted whole.
#                 -> currencies: USD 2, TOKENS 0
#   Accounts      Spend and payables in USD; research_bot may read spend.
#                 -> accounts
#   Ceilings      $10,000.00 for the team; research up to $6,000.00 of it,
#                 ads up to $5,000.00.
#                 -> mandates: team_budget, then two carved from it
#   Deferrals     The annual data subscription is paid ahead and recognized
#                 monthly.                               -> deferrals
#   Usage         research_bot's model tokens: consumed, metered, billed.
#                 -> usages, owned by research_bot
#   Vendors       A model provider, a data vendor and an ad network, all
#                 approved.                              -> Counterparties
#   Rails         x402 and acp both settle. The very first acp call declines;
#                 on day 3, x402 times out three times.
#                 -> rails, and two rail events
#   Timeline      The ad network is suspended on day 7 and a second network
#                 approved; on day 14 the clock moves a day.
#                 -> a Counterparties event, an advance
#   Seed          42.                                    -> seed
